# T1 dual-arm robot blocks environment
# Uses LeftHandEmpty and RightHandEmpty fluents for goal state

name: blocks_t1
geometries:
  cuboid:
    # Movables - raised to waist height (~0.75m)
    # block0:
    #   color: [244, 67, 54]
    #   dims: [0.05, 0.05, 0.05]
    #   pose: [0.45, -0.3, 0.59, -0.97, 0.0, 0.0, 0.23]
    # block1:
    #   color: [33, 150, 243]
    #   dims: [0.05, 0.05, 0.05]
    #   pose: [0.45, 0.32, 0.595, 0.03, 0.0, 0.0, 0.99]
    block2:
      color: [251, 140, 0]
      dims: [0.05, 0.05, 0.05]
      pose: [0.3, -0.325, 0.62, 0.03, 0.0, 0.0, 0.99]
    block3:
      color: [102, 187, 106]
      dims: [0.05, 0.05, 0.05]
      pose: [0.36, 0.32, 0.62, -0.43, 0.0, 0.0, 0.90]

    # Statics - raised to waist height (~0.75m)
    table:
      color: [235, 196, 145]
      dims: [0.6, 0.85, 0.1]
      pose: [0.55, 0.0, 0.53, 1.0, 0.0, 0.0, 0.0]
    goal:
      color: [186, 255, 201]
      dims: [0.45, 0.45, 0.01]
      pose: [0.55, 0.0, 0.585, 1.0, 0.0, 0.0, 0.0]

types:
  Movable: [block2, block3]
  Surface: [table, goal]

goal:
  # "On" needs to be in quotes because it's a YAML keyword
  - "On": [block2, goal]
  - "On": [block3, goal]
  # T1 dual-arm robot uses arm-specific hand empty fluents
  - LeftHandEmpty: []
  - RightHandEmpty: []
