# T1 dual-arm robot blocks environment
# Uses LeftHandEmpty and RightHandEmpty fluents for goal state
# Ground variant — no table; blocks and goal pad sit directly on the floor.

name: blocks_t1
geometries:
  cuboid:
    # Movables on the ground. Block dim = 0.05 → center at z = 0.025.
    block2:
      color: [251, 140, 0]
      dims: [0.05, 0.05, 0.05]
      pose: [0.35, -0.325, 0.025, 0.03, 0.0, 0.0, 0.99]
    block3:
      color: [102, 187, 106]
      dims: [0.05, 0.05, 0.05]
      pose: [0.36, 0.32, 0.025, -0.43, 0.0, 0.0, 0.90]

    # Goal pad on the ground. 1 cm thick slab → center z = 0.005, top at 0.01.
    # Blocks placed on it land at center z = 0.035.
    goal:
      color: [186, 255, 201]
      dims: [0.45, 0.45, 0.01]
      pose: [0.55, 0.0, 0.005, 1.0, 0.0, 0.0, 0.0]

types:
  Movable: [block2, block3]
  Surface: [goal]

goal:
  # "On" needs to be in quotes because it's a YAML keyword
  - "On": [block2, goal]
  - "On": [block3, goal]
  # T1 dual-arm robot uses arm-specific hand empty fluents
  - LeftHandEmpty: []
  - RightHandEmpty: []
  - LeftCanMove: []
  - RightCanMove: []
