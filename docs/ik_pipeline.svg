<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="ik-title ik-desc" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#5A6673">
  <title id="ik-title">CoM-aware inverse-kinematics pipeline</title>
  <desc id="ik-desc">Panel a shows batched three-frame targets entering a 64-candidate LM seed search, selection of K candidates, a pose-and-collision metric branch that either returns early or runs particle and L-BFGS refinement, and the downstream CoM checks. Panel b shows current-state evaluation, a damped LM trial, candidate evaluation, and gain-ratio acceptance in that order; teal annotations identify the CoM additions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6673"/></marker>
  </defs>
  <g id="panel-a" aria-label="Complete IK solve">
    <rect x="24" y="24" width="1032" height="270" rx="12" fill="#FAFBFA" stroke="#DCE1E4"/>
    <text x="48" y="52" font-size="15" font-weight="700" fill="#1D2732">(a) Complete IK solve</text>
    <rect x="48" y="104" width="150" height="72" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="123" y="130" text-anchor="middle" font-weight="600" fill="#1D2732">B three-frame targets</text><text x="123" y="146" text-anchor="middle" font-size="10.5">active hand target;</text><text x="123" y="160" text-anchor="middle" font-size="10.5">inactive hand + base pinned</text>
    <rect x="234" y="104" width="154" height="72" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="311" y="130" text-anchor="middle" font-weight="600" fill="#1D2732">LM seed search</text><text x="311" y="150" text-anchor="middle" font-size="10.5">64 candidates x 30 iterations</text>
    <rect x="424" y="104" width="162" height="72" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="505" y="130" text-anchor="middle" font-weight="600" fill="#1D2732">retain K per target</text><text x="505" y="150" text-anchor="middle" font-size="10.5">K=32 full solve; K=4 periodic re-IK</text>
    <rect x="622" y="104" width="164" height="72" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="704" y="130" text-anchor="middle" font-weight="600" fill="#1D2732">pose + collision metrics</text><text x="704" y="150" text-anchor="middle" font-size="10.5">CoM is not a success criterion</text>
    <path d="M 836 105 L 884 140 L 836 175 L 788 140 Z" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="836" y="143" text-anchor="middle" font-weight="600" fill="#1D2732">all B pass?</text>
    <rect x="908" y="76" width="116" height="64" rx="8" fill="#F0F3F1" stroke="#DCE1E4" stroke-dasharray="5 4"/>
    <text x="966" y="101" text-anchor="middle" font-weight="600" fill="#1D2732">select q*</text><text x="966" y="119" text-anchor="middle" font-size="10.5">return directly</text>
    <rect x="746" y="208" width="190" height="58" rx="8" fill="#FFF5E6" stroke="#B57614"/>
    <text x="841" y="232" text-anchor="middle" font-weight="600" fill="#1D2732">particle optimizer -&gt; L-BFGS</text><text x="841" y="250" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B57614">CoM-blind refinement</text>
    <rect x="958" y="198" width="76" height="68" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="996" y="222" text-anchor="middle" font-weight="600" fill="#1D2732">q* + success</text><text x="996" y="241" text-anchor="middle" font-size="9.5">recomputed pose +</text><text x="996" y="254" text-anchor="middle" font-size="9.5">collision metrics</text>
    <rect x="548" y="208" width="156" height="58" rx="8" fill="#E8F6F3" stroke="#0E7D6B" stroke-dasharray="5 4"/>
    <text x="626" y="232" text-anchor="middle" font-weight="600" fill="#0E7D6B">cuTAMP CoM mask / retry</text><text x="626" y="250" text-anchor="middle" font-size="10.5">then hard ComPolygon constraint</text>
    <g fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#arrow)"><path d="M198 140H228"/><path d="M388 140H418"/><path d="M586 140H616"/><path d="M786 140H788"/><path d="M884 140H902V108H908" stroke-dasharray="5 4"/><path d="M966 140V192" stroke-dasharray="5 4"/><path d="M836 175V202"/><path d="M936 237H952"/><path d="M958 256H704" stroke-dasharray="5 4"/></g>
    <text x="891" y="130" font-size="10" fill="#5A6673">yes</text><text x="848" y="195" font-size="10" fill="#5A6673">no</text>
  </g>
  <g id="panel-b" aria-label="One Levenberg-Marquardt iteration">
    <rect x="24" y="316" width="1032" height="260" rx="12" fill="#FAFBFA" stroke="#DCE1E4"/>
    <text x="48" y="344" font-size="15" font-weight="700" fill="#1D2732">(b) One Levenberg-Marquardt iteration</text>
    <rect x="62" y="388" width="174" height="74" rx="8" fill="#E8F6F3" stroke="#0E7D6B"/>
    <text x="149" y="415" text-anchor="middle" font-weight="600" fill="#1D2732">evaluate current q</text><text x="149" y="435" text-anchor="middle" font-size="10.5">fused FK -&gt; poses, J_pose, CoM</text><text x="149" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7D6B">added</text>
    <rect x="274" y="388" width="176" height="74" rx="8" fill="#E8F6F3" stroke="#0E7D6B"/>
    <text x="362" y="415" text-anchor="middle" font-weight="600" fill="#1D2732">assemble E, g, J</text><text x="362" y="435" text-anchor="middle" font-size="10.5">CoM joins E and g; no Jacobian rows</text><text x="362" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7D6B">added</text>
    <rect x="488" y="388" width="174" height="74" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="575" y="415" text-anchor="middle" font-weight="600" fill="#1D2732">damped LM solve</text><text x="575" y="435" text-anchor="middle" font-size="10">(J^T J + lambda I) delta q = -g</text>
    <rect x="700" y="388" width="174" height="74" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="787" y="415" text-anchor="middle" font-weight="600" fill="#1D2732">evaluate candidate q+</text><text x="787" y="435" text-anchor="middle" font-size="10.5">same FK and objective path</text>
    <rect x="780" y="500" width="222" height="62" rx="8" fill="#F0F3F1" stroke="#DCE1E4"/>
    <text x="891" y="516" text-anchor="middle" font-weight="600" fill="#1D2732">gain-ratio test</text><text x="891" y="530" text-anchor="middle" font-size="9.5">rho = actual / predicted reduction</text><text x="891" y="544" text-anchor="middle" font-size="9.5">accept: q &lt;- q+, lambda / 2;</text><text x="891" y="556" text-anchor="middle" font-size="9.5">reject: keep q, 2 lambda</text>
    <g fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#arrow)"><path d="M236 425H268"/><path d="M450 425H482"/><path d="M662 425H694"/><path d="M787 462V494H891"/><path d="M780 531H520V468H149V462"/></g>
    <text x="475" y="486" font-size="10.5">selected q feeds next iteration</text>
  </g>
  <g id="legend" aria-label="Legend"><rect x="48" y="602" width="12" height="12" fill="#E8F6F3" stroke="#0E7D6B"/><text x="68" y="612" font-size="10.5">teal: CoM addition</text><rect x="202" y="602" width="12" height="12" fill="#FFF5E6" stroke="#B57614"/><text x="222" y="612" font-size="10.5">amber: CoM-blind refinement</text><line x1="440" y1="608" x2="472" y2="608" stroke="#5A6673" stroke-dasharray="5 4"/><text x="480" y="612" font-size="10.5">dashed: conditional / external check</text></g>
</svg>
