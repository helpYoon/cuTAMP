[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cuTAMP"
version = "0.0.1"
description = "cuTAMP"
readme = "README.md"
requires-python = "==3.10.*"
keywords = ["robotics"]
authors = []
classifiers = [
    "Programming Language :: Python :: 3",
]

# The pinned versions are the ones cuTAMP 7238816's plans were accepted on: bump them together and re-check plans.
dependencies = [
    # GraspGenX (the GraspGenX/ submodule) shares this env. Its serve extra is needed in-process: from_sweep_volume imports
    # graspgenx.serving, which loads zmq and msgpack. x86_64 only: its scene-synthesizer[recommend] needs usd-core, and uv
    # finds no usd-core wheel for aarch64 Linux on Python 3.10.
    "graspgenx[serve]; platform_machine == 'x86_64'",
    "nvidia-curobo[cu12]",
    "rerun-sdk==0.27.3",
    "roma==1.5.4",
    "torch==2.9.1",
    "tqdm",
    "trimesh==4.10.1",
    "warp-lang==1.16.0",
    "yourdfpy==0.0.58",
]

[project.optional-dependencies]
editor = [
    "open3d",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",  # 9.2's monkeypatch undo deletes torch's allow_tf32 instead of restoring it
    "ruff",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
constraint-dependencies = ["cuda-bindings==12.9.6", "cuda-core==0.7.0", "cuda-pathfinder==1.5.4"]  # cuRobo's kernel compile and launch
# GraspGenX caps torch < 2.7 only for its authors' older driver (its pyproject says the code runs on 2.7) and pins numpy,
# trimesh and yourdfpy older than cuTAMP's; rerun-sdk needs numpy >= 2. Everything runs on cuTAMP's accepted versions.
# An override replaces every requirement on that name, markers and extras included, and takes the name's index from
# tool.uv.sources: torchvision (only GraspGenX needs it) stays off aarch64 and comes from cu128, and trimesh keeps the
# [easy] extras yourdfpy asks for. The torch override also lifts tensordict 0.15.5's torch >= 2.11 floor: GraspGenX
# lists tensordict but never imports it.
override-dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1; platform_machine == 'x86_64'",
    "numpy==2.2.6",
    "trimesh[easy]==4.10.1",
    "yourdfpy==0.0.58",
]
extra-build-dependencies = { sharedarray = ["setuptools>=45,<78"] }  # GraspGenX's own build fix for this sdist

[tool.uv.sources]
graspgenx = { path = "GraspGenX", editable = true }
nvidia-curobo = { path = "curobo", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
# A bare `pytest` must not collect the submodules' own tests: GraspGenX's tests import graspgenx, and its first import
# clones about 2 GB of unpinned Hugging Face repos unless GRASPGENX_CHECKPOINT_DIR and GRASPGENX_GRIPPER_CFG_DIR both
# point at existing folders.
testpaths = ["cutamp/tests"]

[tool.ruff]
line-length = 120
exclude = ["cutamp/robots/assets"]

[project.scripts]
cutamp-demo = "cutamp.scripts.run_cutamp:entrypoint"

[tool.setuptools.packages]
find = { include = ["cutamp", "cutamp.*"] }
